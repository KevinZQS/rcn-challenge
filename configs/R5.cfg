hostname R5
!
username admin privilege 15 role network-admin secret 0 admin
!
vrf instance MGMT
!
ip routing
!
ipv6 unicast-routing
!
interface Management0
   description OOB_MGMT
   vrf MGMT
   ip address dhcp
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server vrf MGMT
snmp-server host 172.20.20.13 vrf MGMT version 2c public
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
management api gnmi
   transport grpc default
      vrf MGMT
   no shutdown
!
logging vrf MGMT host 172.20.20.13
logging vrf MGMT source-interface Management0
!
management api netconf
   transport ssh default
      vrf MGMT
   no shutdown
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.5/32
   ipv6 address 2001:db8:ffff::5/128
!
interface Ethernet1
   description L3_TO_R3
   no switchport
   ip address 10.20.0.22/30
   ipv6 address 2001:db8:2000:6::2/64
!
interface Ethernet2
   description L3_TO_R4
   no switchport
   ip address 10.20.0.26/30
   ipv6 address 2001:db8:2000:7::2/64
!
interface Ethernet3
   description TO_WEB_SERVER
   no switchport
   ip address 10.30.0.1/24
   ipv6 address 2001:db8:3000:100::1/64
!
router bgp 65100
   neighbor 10.20.0.21 remote-as 65000
   neighbor 10.20.0.25 remote-as 65000
   neighbor 2001:db8:2000:6::1 remote-as 65000
   neighbor 2001:db8:2000:7::1 remote-as 65000
   !
   address-family ipv4
      neighbor 10.20.0.21 activate
      neighbor 10.20.0.25 activate
      network 10.30.0.0/24
   !
   address-family ipv6
      neighbor 2001:db8:2000:6::1 activate
      neighbor 2001:db8:2000:7::1 activate
      network 2001:db8:3000:100::/64
!
