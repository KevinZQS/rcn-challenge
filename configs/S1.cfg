hostname S1
!
username admin privilege 15 role network-admin secret 0 admin
!
vrf instance MGMT
!
interface Management0
   description OOB_MGMT
   vrf MGMT
   ip address dhcp
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server vrf MGMT
snmp-server host 172.20.20.13 vrf MGMT version 2c public
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
management api gnmi
   transport grpc default
      vrf MGMT
   no shutdown
!
logging vrf MGMT host 172.20.20.13
logging vrf MGMT source-interface Management0
!
management api netconf
   transport ssh default
      vrf MGMT
   no shutdown
!
vlan 10
   name VLAN10
!
vlan 20
   name VLAN20
!
vlan 30
   name VLAN30_IPV6_ONLY
!
interface Ethernet1
   description TRUNK_TO_R1
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30
!
interface Ethernet2
   description TRUNK_TO_S2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30
!
interface Ethernet3
   description ACCESS_TO_H1_VLAN10
   switchport mode access
   switchport access vlan 10
!
interface Ethernet4
   description ACCESS_TO_H2_VLAN20
   switchport mode access
   switchport access vlan 20
!
