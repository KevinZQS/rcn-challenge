hostname R1
!
username admin privilege 15 role network-admin secret 0 admin
!
vrf instance MGMT
!
ip routing
!
ipv6 unicast-routing
!
interface Management0
   description OOB_MGMT
   vrf MGMT
   ip address dhcp
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server vrf MGMT
snmp-server host 172.20.20.13 vrf MGMT version 2c public
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
management api gnmi
   transport grpc default
      vrf MGMT
   no shutdown
!
logging vrf MGMT host 172.20.20.13
logging vrf MGMT source-interface Management0
!
management api netconf
   transport ssh default
      vrf MGMT
   no shutdown
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.1/32
   ipv6 address 2001:db8:ffff::1/128
   isis enable LOWER
   isis passive
!
interface Ethernet1
   description TRUNK_TO_S1
   no switchport
!
interface Ethernet1.10
   description VLAN10_GATEWAY
   encapsulation dot1q vlan 10
   ip address 10.10.10.1/24
   ip helper-address 10.20.0.5
   ipv6 address 2001:db8:1000:10::1/64
   isis enable LOWER
   isis passive
!
interface Ethernet1.20
   description VLAN20_GATEWAY
   encapsulation dot1q vlan 20
   ip address 10.10.20.1/24
   ip helper-address 10.20.0.5
   ipv6 address 2001:db8:1000:20::1/64
   isis enable LOWER
   isis passive
!
interface Ethernet2
   description L3_TO_S3
   no switchport
   ip address 10.20.0.1/30
   ipv6 address 2001:db8:2000:1::1/64
   isis enable LOWER
   isis network point-to-point
!
router isis LOWER
   net 49.0001.0000.0000.0001.00
   is-type level-2
   address-family ipv4 unicast
   address-family ipv6 unicast
!
