hostname R2
!
username admin privilege 15 role network-admin secret 0 admin
!
vrf instance MGMT
!
ip routing
!
ipv6 unicast-routing
!
interface Management0
   description OOB_MGMT
   vrf MGMT
   ip address dhcp
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server vrf MGMT
snmp-server host 172.20.20.13 vrf MGMT version 2c public
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
management api gnmi
   transport grpc default
      vrf MGMT
   no shutdown
!
logging vrf MGMT host 172.20.20.13
logging vrf MGMT source-interface Management0
!
management api netconf
   transport ssh default
      vrf MGMT
   no shutdown
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.2/32
   ipv6 address 2001:db8:ffff::2/128
   isis enable LOWER
   isis passive
!
interface Ethernet1
   description TRUNK_TO_S2
   no switchport
!
interface Ethernet1.30
   description VLAN30_IPV6_GATEWAY
   encapsulation dot1q vlan 30
   ipv6 address 2001:db8:1000:30::1/64
   ipv6 nd managed-config-flag
   ipv6 nd prefix 2001:db8:1000:30::/64 2592000 604800 no-autoconfig
   dhcp server ipv6
   isis enable LOWER
   isis passive
!
interface Ethernet2
   description L3_TO_S4
   no switchport
   ip address 10.20.0.5/30
   ipv6 address 2001:db8:2000:2::1/64
   dhcp server ipv4
   isis enable LOWER
   isis network point-to-point
!
dhcp server
   subnet 10.10.10.0/24
      range 10.10.10.50 10.10.10.199
      default-gateway 10.10.10.1
   subnet 10.10.20.0/24
      range 10.10.20.50 10.10.20.199
      default-gateway 10.10.20.1
   subnet 2001:db8:1000:30::/64
      range 2001:db8:1000:30::100 2001:db8:1000:30::1ff
!
router isis LOWER
   net 49.0001.0000.0000.0002.00
   is-type level-2
   address-family ipv4 unicast
   address-family ipv6 unicast
!
