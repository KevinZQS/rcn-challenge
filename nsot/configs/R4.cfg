hostname R4
!
username admin privilege 15 role network-admin secret 0 admin
!
vrf instance MGMT
!
ip routing
!
ipv6 unicast-routing
!
ip prefix-list WEB_V4 seq 10 permit 10.30.0.0/24
!
route-map BGP_TO_OSPF_V4 permit 10
   match ip address prefix-list WEB_V4
!
interface Management0
   description OOB_MGMT
   vrf MGMT
   ip address dhcp
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server vrf MGMT
snmp-server host 172.20.20.13 vrf MGMT version 2c public
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
management api gnmi
   transport grpc default
      vrf MGMT
   no shutdown
!
logging vrf MGMT host 172.20.20.13
logging vrf MGMT source-interface Management0
!
management api netconf
   transport ssh default
      vrf MGMT
   no shutdown
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.4/32
   ipv6 address 2001:db8:ffff::4/128
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet1
   description L3_TO_S4
   no switchport
   ip address 10.20.0.18/30
   ipv6 address 2001:db8:2000:5::2/64
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ipv6 ospf 1 area 0.0.0.0
   ipv6 ospf network point-to-point
!
interface Ethernet2
   description L3_TO_R5
   no switchport
   ip address 10.20.0.25/30
   ipv6 address 2001:db8:2000:7::1/64
!
interface Ethernet3
   description L3_TO_R3
   no switchport
   ip address 10.20.0.30/30
   ipv6 address 2001:db8:2000:8::2/64
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ipv6 ospf 1 area 0.0.0.0
   ipv6 ospf network point-to-point
!
router ospf 1
   router-id 10.255.0.4
   passive-interface Loopback0
   redistribute bgp route-map BGP_TO_OSPF_V4
!
ipv6 router ospf 1
   router-id 10.255.0.4
   passive-interface Loopback0
   redistribute bgp
!
router bgp 65000
   neighbor 10.20.0.26 remote-as 65100
   neighbor 2001:db8:2000:7::2 remote-as 65100
   !
   address-family ipv4
      neighbor 10.20.0.26 activate
      neighbor 10.20.0.26 default-originate always
   !
   address-family ipv6
      neighbor 2001:db8:2000:7::2 activate
      neighbor 2001:db8:2000:7::2 default-originate always
!
