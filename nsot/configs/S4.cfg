hostname S4
!
username admin privilege 15 role network-admin secret 0 admin
!
vrf instance MGMT
!
ip routing
!
ipv6 unicast-routing
!
route-map ISIS_TO_OSPF deny 10
   match tag 110
route-map ISIS_TO_OSPF permit 20
   set tag 115
route-map OSPF_TO_ISIS deny 10
   match tag 115
route-map OSPF_TO_ISIS permit 20
   set tag 110
!
interface Management0
   description OOB_MGMT
   vrf MGMT
   ip address dhcp
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server vrf MGMT
snmp-server host 172.20.20.13 vrf MGMT version 2c public
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
management api gnmi
   transport grpc default
      vrf MGMT
   no shutdown
!
logging vrf MGMT host 172.20.20.13
logging vrf MGMT source-interface Management0
!
management api netconf
   transport ssh default
      vrf MGMT
   no shutdown
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.14/32
   ipv6 address 2001:db8:ffff::14/128
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet1
   description L3_TO_R2
   no switchport
   ip address 10.20.0.6/30
   ipv6 address 2001:db8:2000:2::2/64
   isis enable LOWER
   isis network point-to-point
!
interface Ethernet2
   description L3_TO_S3
   no switchport
   ip address 10.20.0.10/30
   ipv6 address 2001:db8:2000:3::2/64
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ipv6 ospf 1 area 0.0.0.0
   ipv6 ospf network point-to-point
   isis enable LOWER
   isis network point-to-point
!
interface Ethernet3
   description L3_TO_R4
   no switchport
   ip address 10.20.0.17/30
   ipv6 address 2001:db8:2000:5::1/64
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ipv6 ospf 1 area 0.0.0.0
   ipv6 ospf network point-to-point
!
router isis LOWER
   net 49.0001.0000.0000.0014.00
   is-type level-2
   redistribute ospf match external route-map OSPF_TO_ISIS
   redistribute ospfv3 match external route-map OSPF_TO_ISIS
   address-family ipv4 unicast
   address-family ipv6 unicast
!
router ospf 1
   router-id 10.255.0.14
   passive-interface Loopback0
   redistribute isis level-2 route-map ISIS_TO_OSPF
!
ipv6 router ospf 1
   router-id 10.255.0.14
   passive-interface Loopback0
   redistribute isis level-2 route-map ISIS_TO_OSPF
   distance ospf external 120
!
