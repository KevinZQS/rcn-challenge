hostname: R3
vendor: arista_eos
role: core_router
mgmt:
  snmp_host: 172.20.20.13
  syslog_host: 172.20.20.13
  community: public
prefix_lists:
  - name: WEB_V4
    seq: 10
    action: permit
    prefix: 10.30.0.0/24
route_maps:
  - name: BGP_TO_OSPF_V4
    action: permit
    seq: 10
    match: ip address prefix-list WEB_V4
loopback:
  ipv4: 10.255.0.3/32
  ipv6: 2001:db8:ffff::3/128
  ospf: true
interfaces:
  - name: Ethernet1
    description: L3_TO_S3
    routed: true
    ipv4: 10.20.0.14/30
    ipv6: 2001:db8:2000:4::2/64
    ospf: p2p
  - name: Ethernet2
    description: L3_TO_R5
    routed: true
    ipv4: 10.20.0.21/30
    ipv6: 2001:db8:2000:6::1/64
  - name: Ethernet3
    description: L3_TO_R4
    routed: true
    ipv4: 10.20.0.29/30
    ipv6: 2001:db8:2000:8::1/64
    ospf: p2p
ospf:
  router_id: 10.255.0.3
  redistribute_bgp: true
  redistribute_bgp_route_map: BGP_TO_OSPF_V4
bgp:
  asn: 65000
  neighbors:
    - ip: 10.20.0.22
      remote_as: 65100
      af: ipv4
      default_originate: true
    - ip: 2001:db8:2000:6::2
      remote_as: 65100
      af: ipv6
      default_originate: true
